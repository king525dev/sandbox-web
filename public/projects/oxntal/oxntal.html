<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxntal: Web IDE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../../resources/icon/icon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
        BASE
        ============================================================ */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, "Segoe UI", Verdana, Geneva, sans-serif;
            font-size: 11px;
            color: #000;
            background: #245edb;
            background: linear-gradient(180deg, #4a8ae0 0%, #245edb 45%, #123f96 100%);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
        APP / WINDOW SHELL
        ============================================================ */
        .app {
            height: 100vh;
            padding: 8px 8px 0;
            display: flex;
            flex-direction: column;
        }

        .window {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #ece9d8;
            border: 1px solid #0a3a8f;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .45);
        }

        /* ---------- title bar ---------- */
        .titlebar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 28px;
            padding: 0 8px;
            background: linear-gradient(180deg,
                    #0058ee 0%, #3f8cf3 8%, #0054e3 42%, #0054e3 88%, #3f8cf3 100%);
            border-bottom: 1px solid #0a246a;
            color: #fff;
            user-select: none;
            overflow: hidden;
        }

        .logo {
            font-family: "Press Start 2P", "Courier New", monospace;
            font-size: 13px;
            line-height: 1;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 1px 1px 0 #062a6b, 2px 2px 4px rgba(0, 0, 0, .5);
            padding-top: 2px;
            white-space: nowrap;
        }

        .logo-sub {
            font-size: 10px;
            letter-spacing: .5px;
            color: #cfe0ff;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, .4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- toolbar ---------- */
        .toolbar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 5px 7px;
            background: linear-gradient(180deg, #fdfdfa 0%, #ece9d8 55%, #ddd8c7 100%);
            border-bottom: 1px solid #a8a496;
            box-shadow: inset 0 1px 0 #fff;
        }

        .tb-sep {
            width: 1px;
            height: 20px;
            margin: 0 3px;
            background: #b6b2a4;
            box-shadow: 1px 0 0 #fff;
            flex: 0 0 auto;
        }

        /* ---------- buttons ---------- */
        .btn {
            font: 11px Tahoma, Verdana, sans-serif;
            color: #10233f;
            padding: 3px 10px 4px;
            min-height: 22px;
            border: 1px solid #7d9dbd;
            border-radius: 3px;
            background: linear-gradient(180deg,
                    #ffffff 0%, #f4f2ea 45%, #e7e2d6 46%, #d9d3c6 100%);
            box-shadow: inset 0 0 0 1px #fff, 0 1px 1px rgba(0, 0, 0, .12);
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            user-select: none;
        }

        .btn:hover {
            border-color: #e8a33d;
            background: linear-gradient(180deg,
                    #fffdf6 0%, #fdf3dc 45%, #f6e3b8 46%, #f0d79c 100%);
        }

        .btn:active {
            background: linear-gradient(180deg, #cfc9bb, #e6e1d5);
            box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .28);
            padding-top: 4px;
            padding-bottom: 3px;
        }

        .btn.primary {
            font-weight: bold;
        }

        /* ---------- dropdown menu ---------- */
        .menu {
            position: relative;
            display: inline-block;
        }

        .menu-list {
            display: none;
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            z-index: 200;
            min-width: 200px;
            margin: 0;
            padding: 2px;
            list-style: none;
            background: #fff;
            border: 1px solid #a0a0a0;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, .35);
        }

        .menu.open .menu-list {
            display: block;
        }

        .menu-list li {
            padding: 4px 24px 4px 22px;
            font-size: 11px;
            cursor: default;
            white-space: nowrap;
            position: relative;
        }

        .menu-list li::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 50%;
            width: 6px;
            height: 6px;
            margin-top: -3px;
            background: #9aa7b8;
            border-radius: 1px;
        }

        .menu-list li:hover {
            background: #316ac5;
            color: #fff;
        }

        .menu-list li:hover::before {
            background: #fff;
        }

        /* ============================================================
        WORKSPACE
        ============================================================ */
        .workspace {
            flex: 1 1 auto;
            min-height: 0;
            margin: 4px 4px 0;
            display: flex;
            flex-direction: row;
            background: #ece9d8;
            border: 1px solid #a8a496;
            box-shadow: inset 0 1px 0 #fff;
            overflow: hidden;
        }

        .main-col {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .bottom-row {
            flex: 2 1 0;
            min-width: 0;
            min-height: 60px;
            display: flex;
            flex-direction: row;
        }

        /* ---------- panel ---------- */
        .panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: #ece9d8;
            border: 1px solid #a8a496;
            box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #cfcabb;
            overflow: hidden;
        }

        #panelSource {
            flex: 1 1 0;
            min-height: 56px;
        }

        #panelOutput {
            flex: 1 1 0;
            min-width: 80px;
        }

        #panelDisplay {
            flex: 1 1 0;
            min-width: 80px;
        }

        .panel-title {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 20px;
            padding: 0 3px 0 7px;
            background: linear-gradient(180deg,
                    #0a5fe0 0%, #4a9bf5 8%, #0a5fe0 45%, #0653c8 92%, #4a9bf5 100%);
            border-bottom: 1px solid #063d92;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: .9px;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, .45);
            user-select: none;
        }

        .panel-title .label {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pbtn {
            flex: 0 0 auto;
            width: 15px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: Tahoma, sans-serif;
            font-size: 9px;
            line-height: 1;
            color: #fff;
            background: linear-gradient(180deg, #7db4f7 0%, #2c74d8 50%, #1b5cbe 100%);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 2px;
            cursor: pointer;
        }

        .pbtn:hover {
            background: linear-gradient(180deg, #a8ccff, #3b83e6);
        }

        .pbtn:active {
            background: #1b5cbe;
        }

        .panel-body {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* ---------- splitters ---------- */
        .splitter {
            flex: 0 0 auto;
            position: relative;
            background: #ece9d8;
            user-select: none;
        }

        .splitter.h {
            height: 6px;
            cursor: row-resize;
        }

        .splitter.v {
            width: 6px;
            cursor: col-resize;
        }

        .splitter::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 3px;
            background: repeating-linear-gradient(90deg, #a9a496 0 2px, transparent 2px 5px);
        }

        .splitter.v::after {
            width: 3px;
            height: 24px;
            background: repeating-linear-gradient(180deg, #a9a496 0 2px, transparent 2px 5px);
        }

        .splitter:hover {
            background: #dfe8f6;
        }

        /* ============================================================
        SOURCE EDITOR
        ============================================================ */
        #panelSource .panel-body {
            background: #101018;
            border-top: 1px solid #808080;
        }

        #source {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            resize: none;
            border: 0;
            outline: 0;
            padding: 8px 10px;
            background: #101018;
            color: #e2e2e2;
            font-family: Consolas, "Lucida Console", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
            caret-color: #7fd4ff;
        }

        #source::selection {
            background: #2d5fa8;
            color: #fff;
        }

        /* ============================================================
        CONSOLE (OUTPUT + LOG)
        ============================================================ */
        .console-wrap {
            background: #0b0b0b;
            border-top: 1px solid #808080;
            flex-direction: column;
        }

        .console {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: 6px 8px;
            font-family: Consolas, "Lucida Console", "Courier New", monospace;
            font-size: 12px;
            line-height: 1.45;
            color: #d6d6d6;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }

        .console .err {
            display: block;
            margin: 4px 0;
            padding: 4px 7px;
            color: #ffb3b3;
            background: #3a0f0f;
            border-left: 3px solid #ff4d4d;
            white-space: pre-wrap;
        }

        /* ============================================================
        DISPLAY
        ============================================================ */
        #panelDisplay .panel-body {
            background: #262626;
            border-top: 1px solid #808080;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        #screen {
            flex: 0 0 auto;
            display: block;
            background: #000;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ============================================================
        LOG SLOT (collapsible right side panel)
        ============================================================ */
        .log-slot {
            flex: 0 0 auto;
            display: flex;
            flex-direction: row;
            min-height: 0;
        }

        .log-splitter {
            display: none;
            flex: 0 0 auto;
            width: 6px;
            position: relative;
            background: #ece9d8;
            cursor: col-resize;
            user-select: none;
        }

        .log-splitter::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 24px;
            background: repeating-linear-gradient(180deg, #a9a496 0 2px, transparent 2px 5px);
        }

        .log-splitter:hover {
            background: #dfe8f6;
        }

        .log-slot.open .log-splitter {
            display: block;
        }

        #panelLog {
            display: none;
            flex: 0 0 auto;
            width: 300px;
        }

        .log-slot.open #panelLog {
            display: flex;
        }

        .log-tab {
            flex: 0 0 auto;
            width: 20px;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #ded9c9 0%, #f7f5ef 45%, #ece9d8 100%);
            border: none;
            border-left: 1px solid #a8a496;
            box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #cfcabb;
            color: #123a72;
            font: bold 10px Tahoma, Verdana, sans-serif;
            cursor: pointer;
            user-select: none;
        }

        .log-tab span {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 3px;
        }

        .log-tab:hover {
            background: linear-gradient(90deg, #d6e4f7, #f2f7ff);
        }

        /* ============================================================
        STATUS BAR
        ============================================================ */
        .statusbar {
            flex: 0 0 auto;
            display: flex;
            align-items: stretch;
            gap: 3px;
            height: 22px;
            margin: 4px;
        }

        .status-cell {
            display: flex;
            align-items: center;
            padding: 0 8px;
            background: #ece9d8;
            border: 1px solid;
            border-color: #a8a496 #fff #fff #a8a496;
            font-size: 11px;
            color: #2c2c2c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-cell.grow {
            flex: 1 1 auto;
        }

        /* ============================================================
        FULLSCREEN / MAXIMIZE MODES
        ============================================================ */
        .workspace[data-max="source"] .main-col>.panel:not(#panelSource),
        .workspace[data-max="source"] .main-col>.splitter,
        .workspace[data-max="source"] #bottomRow {
            display: none;
        }

        .workspace[data-max="source"] #panelSource {
            flex: 1 1 auto !important;
        }

        .workspace[data-max="output"] .main-col>.panel,
        .workspace[data-max="output"] .main-col>.splitter,
        .workspace[data-max="output"] #panelDisplay,
        .workspace[data-max="output"] #vsplit {
            display: none;
        }

        .workspace[data-max="output"] #panelOutput {
            flex: 1 1 auto !important;
        }

        .workspace[data-max="display"] .main-col>.panel,
        .workspace[data-max="display"] .main-col>.splitter,
        .workspace[data-max="display"] #panelOutput,
        .workspace[data-max="display"] #vsplit {
            display: none;
        }

        .workspace[data-max="display"] #panelDisplay {
            flex: 1 1 auto !important;
        }

        .workspace[data-max="log"] .main-col {
            display: none;
        }

        .workspace[data-max="log"] .log-splitter {
            display: none !important;
        }

        .workspace[data-max="log"] .log-slot {
            flex: 1 1 auto;
        }

        .workspace[data-max="log"] #panelLog {
            flex: 1 1 auto !important;
            width: auto !important;
        }

        .workspace[data-max="log"] .log-tab {
            display: none;
        }

        /* ============================================================
        RESPONSIVE (desktop-first)
        ============================================================ */
        @media (max-width: 760px) {
            .bottom-row {
                flex-direction: column;
            }

            .splitter.v {
                width: auto;
                height: 6px;
                cursor: row-resize;
            }

            .splitter.v::after {
                width: 24px;
                height: 3px;
                background: repeating-linear-gradient(90deg, #a9a496 0 2px, transparent 2px 5px);
            }

            #panelOutput,
            #panelDisplay {
                min-width: 0;
                min-height: 50px;
            }

            .logo-sub {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="window">

            <!-- ================= TITLE BAR ================= -->
            <header class="titlebar">
                <span class="logo">OXNTAL</span>
                <span class="logo-sub">Web Development Environment</span>
            </header>

            <!-- ================= TOOLBAR ================= -->
            <nav class="toolbar">
                <button class="btn primary" id="runBtn" title="Run the program (Ctrl+Enter)">&#9654; Run</button>
                <button class="btn" id="runLogBtn" title="Run and capture the execution log">&#9654; Run + Log</button>

                <span class="tb-sep"></span>

                <div class="menu" id="samplesMenu">
                    <button class="btn" id="samplesBtn">Samples &#9662;</button>
                    <ul class="menu-list" id="samplesList"></ul>
                </div>

                <button class="btn" id="downloadBtn" title="Download the current source as program.oxn">&#10515;
                    Download .oxn</button>

                <span class="tb-sep"></span>

                <a class="btn" id="linkGithub" href="#" target="_blank" rel="noopener">GitHub</a>
                <a class="btn" id="linkDocs" href="#" target="_blank" rel="noopener">Documentation</a>
                <a class="btn" id="linkTutorial" href="#" target="_blank" rel="noopener">Tutorial</a>
            </nav>

            <!-- ================= WORKSPACE ================= -->
            <div class="workspace" id="workspace">
                <div class="main-col" id="mainCol">

                    <!-- SOURCE -->
                    <section class="panel" id="panelSource">
                        <div class="panel-title">
                            <span class="label">SOURCE</span>
                            <button class="pbtn" data-max="source" title="Maximize / restore">&#9633;</button>
                        </div>
                        <div class="panel-body">
                            <textarea id="source" spellcheck="false" wrap="off"
                                aria-label="Oxntal source code"></textarea>
                        </div>
                    </section>

                    <div class="splitter h" id="hsplit" title="Drag to resize"></div>

                    <div class="bottom-row" id="bottomRow">

                        <!-- OUTPUT -->
                        <section class="panel" id="panelOutput">
                            <div class="panel-title">
                                <span class="label">OUTPUT</span>
                                <button class="pbtn" data-max="output" title="Maximize / restore">&#9633;</button>
                            </div>
                            <div class="panel-body console-wrap">
                                <div class="console" id="output"></div>
                            </div>
                        </section>

                        <div class="splitter v" id="vsplit" title="Drag to resize"></div>

                        <!-- DISPLAY -->
                        <section class="panel" id="panelDisplay">
                            <div class="panel-title">
                                <span class="label">DISPLAY</span>
                                <button class="pbtn" data-max="display" title="Maximize / restore">&#9633;</button>
                            </div>
                            <div class="panel-body">
                                <canvas id="screen" width="256" height="256"></canvas>
                            </div>
                        </section>

                    </div>
                </div>

                <!-- LOG SLOT -->
                <div class="log-slot" id="logSlot">
                    <div class="log-splitter" id="logSplitter" title="Drag to resize"></div>

                    <section class="panel" id="panelLog">
                        <div class="panel-title">
                            <span class="label">LOG</span>
                            <button class="pbtn" data-max="log" title="Maximize / restore">&#9633;</button>
                            <button class="pbtn" id="logClose" title="Collapse log">&#10005;</button>
                        </div>
                        <div class="panel-body console-wrap">
                            <div class="console" id="log"></div>
                        </div>
                    </section>

                    <button class="log-tab" id="logTab" title="Show log"><span>LOG</span></button>
                </div>
            </div>

            <!-- ================= STATUS BAR ================= -->
            <div class="statusbar">
                <span class="status-cell" id="status">Ready</span>
                <span class="status-cell grow"></span>
                <span class="status-cell" id="statusInfo">&mdash;</span>
            </div>
        </div>
    </div>

    <!-- Load the bundled Oxntal runtime. Adjust the path if your build output differs. -->
    <script src="../../dist/web/oxntal.iife.js"></script>

    <script>
        (function () {
            "use strict";

            /* ==========================================================
            CONFIG — replace the "#" placeholders with real URLs
            ========================================================== */
            const LINKS = {
                github: "#",    // TODO: real GitHub repository URL
                docs: "#",      // TODO: real documentation URL
                tutorial: "#"   // TODO: real tutorial URL
            };

            const DEFAULT_SOURCE =
                '// Print "Hi!" and then show a bar for value 42.\n' +
                'LDA " 33 105 72 "\n' +
                'DCD * 3\n' +
                'LDA 42\n' +
                'SHW\n' +
                'BRK\n';

            const SAMPLES = [
                {
                    name: "Hello World",
                    source:
                        '// Print "Hello World" to stdout. //\n' +
                        'LDA " 100 108 114 111 87 32 111 108 108 101 72 "\n' +
                        'DCD * 11\n' +
                        'BRK\n'
                },
                {
                    name: "Greeting + Bar",
                    source: DEFAULT_SOURCE
                },
                {
                    name: "Bar Chart",
                    source:
                        '// Draw a series of bars. //\n' +
                        'LDA 16\n' +
                        'SHW\n' +
                        'LDA 32\n' +
                        'SHW\n' +
                        'LDA 48\n' +
                        'SHW\n' +
                        'LDA 64\n' +
                        'SHW\n' +
                        'LDA 96\n' +
                        'SHW\n' +
                        'BRK\n'
                },
                {
                    name: "Single Tall Bar",
                    source:
                        '// One large bar. //\n' +
                        'LDA 200\n' +
                        'SHW\n' +
                        'BRK\n'
                },
                {
                    name: "Text + Display",
                    source:
                        '// Print a label, then draw a bar. //\n' +
                        'LDA " 33 111 108 108 101 72 "\n' +
                        'DCD * 6\n' +
                        'LDA 120\n' +
                        'SHW\n' +
                        'BRK\n'
                }
            ];

            /* ==========================================================
            SHORTCUTS
            ========================================================== */
            const $ = (id) => document.getElementById(id);
            const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

            const workspace = $("workspace");
            const mainCol = $("mainCol");
            const bottomRow = $("bottomRow");
            const panelSource = $("panelSource");
            const panelOutput = $("panelOutput");
            const panelDisplay = $("panelDisplay");
            const panelLog = $("panelLog");
            const logSlot = $("logSlot");
            const logTab = $("logTab");
            const logSplitter = $("logSplitter");
            const sourceEl = $("source");
            const outputEl = $("output");
            const logEl = $("log");
            const canvas = $("screen");
            const statusEl = $("status");
            const statusInfoEl = $("statusInfo");

            /* ==========================================================
            GENERIC DRAG HELPER
            ========================================================== */
            function startDrag(e, cursor, onMove, onEnd) {
                if (e.button !== undefined && e.button !== 0) return;
                e.preventDefault();

                const prevCursor = document.body.style.cursor;
                const prevSelect = document.body.style.userSelect;
                document.body.style.cursor = cursor;
                document.body.style.userSelect = "none";

                function move(ev) { onMove(ev); }
                function up() {
                    document.removeEventListener("mousemove", move);
                    document.removeEventListener("mouseup", up);
                    document.body.style.cursor = prevCursor;
                    document.body.style.userSelect = prevSelect;
                    if (onEnd) onEnd();
                }

                document.addEventListener("mousemove", move);
                document.addEventListener("mouseup", up);
            }

            /* ==========================================================
            PANEL RESIZING
            ========================================================== */

            // Vertical divider between SOURCE and the bottom row
            $("hsplit").addEventListener("mousedown", function (e) {
                const rect = mainCol.getBoundingClientRect();
                const total = Math.max(1, rect.height - 6);
                startDrag(e, "row-resize", function (ev) {
                    const ratio = clamp((ev.clientY - rect.top - 3) / total, 0.12, 0.85);
                    panelSource.style.flexGrow = String(ratio);
                    bottomRow.style.flexGrow = String(1 - ratio);
                });
            });

            // Divider between OUTPUT and DISPLAY (horizontal or vertical layout)
            $("vsplit").addEventListener("mousedown", function (e) {
                const rect = bottomRow.getBoundingClientRect();
                const isColumn = getComputedStyle(bottomRow).flexDirection === "column";
                const total = Math.max(1, (isColumn ? rect.height : rect.width) - 6);
                const origin = isColumn ? rect.top : rect.left;

                startDrag(e, isColumn ? "row-resize" : "col-resize", function (ev) {
                    const pos = (isColumn ? ev.clientY : ev.clientX) - origin - 3;
                    const ratio = clamp(pos / total, 0.15, 0.85);
                    panelOutput.style.flexGrow = String(ratio);
                    panelDisplay.style.flexGrow = String(1 - ratio);
                });
            });

            /* ==========================================================
            LOG PANEL: open / close / resize
            ========================================================== */
            let logOpen = false;
            let logWidth = clamp(Math.floor(window.innerWidth * 0.25), 220, 340);
            let maximized = null;

            function setLogOpen(open) {
                open = !!open;
                if (!open && maximized === "log") setMax(null);

                logOpen = open;
                logSlot.classList.toggle("open", open);
                logTab.title = open ? "Hide log" : "Show log";

                if (open) panelLog.style.width = logWidth + "px";
                requestAnimationFrame(fitCanvas);
            }

            // Click / pull the tab
            logTab.addEventListener("mousedown", function (e) {
                const startX = e.clientX;
                const startW = logOpen ? logWidth : 0;
                let moved = false;

                startDrag(e, "col-resize", function (ev) {
                    const dx = startX - ev.clientX;
                    if (Math.abs(dx) > 5) moved = true;
                    if (moved) {
                        if (!logOpen) setLogOpen(true);
                        const maxW = Math.max(240, window.innerWidth - 200);
                        logWidth = clamp(startW + dx, 160, maxW);
                        panelLog.style.width = logWidth + "px";
                    }
                }, function () {
                    if (!moved) setLogOpen(!logOpen);
                });
            });

            // Drag the log's left border
            logSplitter.addEventListener("mousedown", function (e) {
                const right = panelLog.getBoundingClientRect().right;
                startDrag(e, "col-resize", function (ev) {
                    const maxW = Math.max(240, window.innerWidth - 200);
                    logWidth = clamp(right - ev.clientX, 160, maxW);
                    panelLog.style.width = logWidth + "px";
                });
            });

            $("logClose").addEventListener("click", function () {
                setLogOpen(false);
            });

            /* ==========================================================
            FULLSCREEN / MAXIMIZE
            ========================================================== */
            function setMax(name) {
                maximized = name || null;
                if (maximized) workspace.setAttribute("data-max", maximized);
                else workspace.removeAttribute("data-max");
                updateMaxButtons();
                requestAnimationFrame(fitCanvas);
            }

            function toggleMax(name) {
                if (name === "log" && maximized !== "log") setLogOpen(true);
                setMax(maximized === name ? null : name);
            }

            function updateMaxButtons() {
                const buttons = document.querySelectorAll(".pbtn[data-max]");
                for (let i = 0; i < buttons.length; i++) {
                    const btn = buttons[i];
                    const isMax = maximized === btn.getAttribute("data-max");
                    btn.innerHTML = isMax ? "&#9635;" : "&#9633;";
                    btn.title = isMax ? "Restore panel" : "Maximize panel";
                }
            }

            (function bindMaxButtons() {
                const buttons = document.querySelectorAll(".pbtn[data-max]");
                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].addEventListener("click", function () {
                        toggleMax(this.getAttribute("data-max"));
                    });
                }
            })();

            /* ==========================================================
            CANVAS FITTING
            ========================================================== */
            const displayBody = panelDisplay.querySelector(".panel-body");
            const MAX_CANVAS = 512;

            function fitCanvas() {
                if (!displayBody) return;
                const w = displayBody.clientWidth - 20;
                const h = displayBody.clientHeight - 20;
                const size = Math.floor(Math.min(w, h, MAX_CANVAS));
                if (size < 24) return;
                canvas.style.width = size + "px";
                canvas.style.height = size + "px";
            }

            if (typeof ResizeObserver !== "undefined") {
                new ResizeObserver(fitCanvas).observe(displayBody);
            }
            window.addEventListener("resize", function () {
                fitCanvas();
                if (logOpen) {
                    logWidth = clamp(logWidth, 160, Math.max(240, window.innerWidth - 200));
                    panelLog.style.width = logWidth + "px";
                }
            });

            /* ==========================================================
            SOURCE EDITOR BEHAVIOUR
            ========================================================== */
            sourceEl.value = DEFAULT_SOURCE;

            function updateInfo() {
                const v = sourceEl.value;
                const lines = v.length ? v.split("\n").length : 0;
                statusInfoEl.textContent = lines + " lines \u00b7 " + v.length + " chars";
            }

            sourceEl.addEventListener("input", updateInfo);

            sourceEl.addEventListener("keydown", function (e) {
                // Tab inserts spaces instead of moving focus
                if (e.key === "Tab") {
                    e.preventDefault();
                    const start = sourceEl.selectionStart;
                    const end = sourceEl.selectionEnd;
                    sourceEl.value =
                        sourceEl.value.slice(0, start) + "    " + sourceEl.value.slice(end);
                    sourceEl.selectionStart = sourceEl.selectionEnd = start + 4;
                    updateInfo();
                    return;
                }
                // Ctrl/Cmd + Enter runs
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    e.preventDefault();
                    run(false);
                }
            });

            /* ==========================================================
            OUTPUT RENDERING
            ========================================================== */
            function setStatus(text) {
                statusEl.textContent = text;
            }

            function clearOutput() {
                outputEl.textContent = "";
            }

            function appendError(kind, message) {
                const div = document.createElement("div");
                div.className = "err";
                div.textContent = "[" + kind + "] " + message;
                outputEl.appendChild(div);
            }

            function describeError(err) {
                if (!err) return null;
                if (typeof err === "string") return { kind: "Error", message: err };
                return {
                    kind: err.kind || err.name || "Error",
                    message: err.message || String(err)
                };
            }

            /* ==========================================================
            RUN
            ========================================================== */
            function run(withLog) {
                clearOutput();
                setStatus("Running\u2026");

                if (!window.Oxntal || typeof window.Oxntal.run !== "function") {
                    appendError(
                        "Runtime",
                        "window.Oxntal is not available. Check that ../../dist/web/oxntal.iife.js loaded."
                    );
                    setStatus("Error");
                    return;
                }

                let result;
                try {
                    result = window.Oxntal.run({
                        source: sourceEl.value,
                        canvas: canvas,
                        captureLog: !!withLog
                    });
                } catch (err) {
                    appendError("Exception", (err && err.message) ? err.message : String(err));
                    setStatus("Error");
                    return;
                }

                result = result || {};

                // Normal stdout
                if (typeof result.stdout === "string" && result.stdout.length) {
                    outputEl.appendChild(document.createTextNode(result.stdout));
                }

                // Errors (shown inside the same panel, clearly styled)
                const err = describeError(result.error);
                if (err) {
                    appendError(err.kind, err.message);
                } else if (typeof result.stderr === "string" && result.stderr.length) {
                    appendError("stderr", result.stderr);
                }

                // Log
                if (withLog) {
                    logEl.textContent =
                        (result.log !== undefined && result.log !== null)
                            ? String(result.log)
                            : "(log not captured)";
                    logEl.scrollTop = 0;
                    setLogOpen(true);
                }

                outputEl.scrollTop = 0;
                setStatus(err ? "Finished with errors" : "Finished");
            }

            $("runBtn").addEventListener("click", function () { run(false); });
            $("runLogBtn").addEventListener("click", function () { run(true); });

            /* ==========================================================
            SAMPLES MENU
            ========================================================== */
            const samplesMenu = $("samplesMenu");
            const samplesList = $("samplesList");

            SAMPLES.forEach(function (sample) {
                const li = document.createElement("li");
                li.textContent = sample.name;
                li.addEventListener("click", function () {
                    sourceEl.value = sample.source;
                    samplesMenu.classList.remove("open");
                    updateInfo();
                    setStatus("Loaded sample: " + sample.name);
                });
                samplesList.appendChild(li);
            });

            $("samplesBtn").addEventListener("click", function (e) {
                e.stopPropagation();
                samplesMenu.classList.toggle("open");
            });

            document.addEventListener("click", function () {
                samplesMenu.classList.remove("open");
            });

            /* ==========================================================
            DOWNLOAD CURRENT SOURCE
            ========================================================== */
            $("downloadBtn").addEventListener("click", function () {
                const blob = new Blob([sourceEl.value], {
                    type: "text/plain;charset=utf-8"
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "program.oxn";
                document.body.appendChild(a);
                a.click();
                setTimeout(function () {
                    URL.revokeObjectURL(url);
                    a.remove();
                }, 0);
                setStatus("Downloaded program.oxn");
            });

            /* ==========================================================
            INITIAL PANEL SIZES
            ========================================================== */
            function initPanelSizes() {
                const rect = bottomRow.getBoundingClientRect();
                const isColumn = getComputedStyle(bottomRow).flexDirection === "column";
                const total = isColumn ? rect.height : rect.width;
                if (total < 80) return;

                // Canvas is 256px + 2px border each side + 8px padding each side
                const canvasTarget = canvas.width + 4 + 16;   // ≈ 276px

                // Convert target width into a flex ratio and clamp it so OUTPUT stays usable
                let ratio = clamp(canvasTarget / total, 0.15, 0.60);

                panelDisplay.style.flexGrow = String(ratio);
                panelOutput.style.flexGrow  = String(1 - ratio);
            }

            /* ==========================================================
            EXTERNAL LINKS
            ========================================================== */
            $("linkGithub").href = LINKS.github;
            $("linkDocs").href = LINKS.docs;
            $("linkTutorial").href = LINKS.tutorial;

            /* ==========================================================
            BOOT
            ========================================================== */
            updateInfo();
            updateMaxButtons();

            requestAnimationFrame(function () {
                initPanelSizes();
                fitCanvas();
                setStatus("Ready");
            });
        })();
    </script>
</body>

</html>
