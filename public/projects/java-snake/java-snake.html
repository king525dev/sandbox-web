<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Snake</title>

<!-- Icon -->
<link rel="icon" href="../../resources/icon/icon.ico">

<style>
/* ===== Base ===== */
body {
     margin: 0;
     background: #0b0f0b;
     color: #9cff9c;
     font-family: "Courier New", monospace;
     overflow: hidden;
}

/* ===== Grid Layout ===== */
.page {
     display: grid;
     grid-template-columns: 1fr 600px 1fr;
     grid-template-rows: 1fr;
     height: 100vh;
}

/* ===== Pixel Background ===== */
.pixel-bg {
     position: relative;
     background:
          linear-gradient(#102010 1px, transparent 1px),
          linear-gradient(90deg, #102010 1px, transparent 1px);
     background-size: 20px 20px;
}

/* ===== Center Panel ===== */
.center {
     background: #050805;
     border: 4px solid #2aff2a;
     box-shadow: 0 0 30px #1cff1c;
     padding: 24px;
     text-align: center;
     image-rendering: pixelated;
}

.center h1 {
     margin-top: 0;
     font-size: 32px;
}

.center p {
     font-size: 16px;
     line-height: 1.6;
}

/* ===== Buttons ===== */
.btn {
     display: inline-block;
     margin: 12px;
     padding: 12px 20px;
     border: 2px solid #2aff2a;
     color: #2aff2a;
     text-decoration: none;
     background: #000;
     transition: all 0.2s ease;
}

.btn:hover {
     background: #2aff2a;
     color: #000;
}

/* ===== Snake ===== */
.snake {
     position: absolute;
     width: 16px;
     height: 16px;
     background: #2aff2a;
}

</style>
</head>
<body>

<div class="page">

     <div class="pixel-bg" id="left"></div>

     <div class="center">
          <h1>JAVA SNAKE</h1>
          <p>
               A classic Snake game written in Java.<br><br>
               Control the snake, eat food, grow longer, and avoid hitting yourself.
               Simple mechanics, retro visuals, and pure arcade nostalgia.
          </p>

          <a class="btn" href="snake.exe" download>⬇ Download .EXE</a>
          <a class="btn" href="https://github.com/king525dev/Sandbox/tree/main/Java/snake" target="_blank">
               View on GitHub
          </a>
     </div>

     <div class="pixel-bg" id="right"></div>

</div>

<script>
/* ===== Snake Animation ===== */
const bgElements = document.querySelectorAll('.pixel-bg');
const snakes = [];

function createSnake(container) {
     const snake = document.createElement('div');
     snake.classList.add('snake');
     container.appendChild(snake);

     return {
          el: snake,
          x: Math.random() * container.clientWidth,
          y: Math.random() * container.clientHeight,
          dx: (Math.random() < 0.5 ? -1 : 1) * 2,
          dy: (Math.random() < 0.5 ? -1 : 1) * 2,
          container
     };
}

bgElements.forEach(bg => {
     for (let i = 0; i < 6; i++) {
          snakes.push(createSnake(bg));
     }
});

function update() {
     snakes.forEach(s => {
          s.x += s.dx;
          s.y += s.dy;

          if (s.x < 0 || s.x > s.container.clientWidth - 16) s.dx *= -1;
          if (s.y < 0 || s.y > s.container.clientHeight - 16) s.dy *= -1;

          s.el.style.transform = `translate(${s.x}px, ${s.y}px)`;
     });

     requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
